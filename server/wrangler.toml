name = "coachjett-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Secrets are never committed. Set them with:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put DEEPSEEK_API_KEY
#   wrangler secret put DEV_SHARED_SECRET     # simulator bypass only

[vars]
# Which provider answers each surface. Changing these is a deploy, not an App Review,
# which is most of why this server exists.
COACH_PROVIDER = "deepseek"
# Pro rather than Flash: the coach reasons over the whole data block. It has no vision,
# which the coach does not need — meal photos stay on Flash below for exactly that reason.
COACH_MODEL = "deepseek-v4-pro"
MEAL_PROVIDER = "deepseek"
MEAL_MODEL = "deepseek-flash"
# App Attest stays off until `identify()` can actually verify an attestation. The team
# ID is no longer the blocker — the project has had one since the signing config landed,
# and the payload is validated against <teamID>.<bundleID>, so it is filled in here ready.
# Turning this on before the verification exists would return 501 to every request.
REQUIRE_ATTESTATION = "false"
APPLE_TEAM_ID = "V9JX42F864"
BUNDLE_ID = "com.coachjett.ios"

[[durable_objects.bindings]]
name = "BUCKET"
class_name = "RateBucket"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateBucket"]

