name = "coachjett-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Every deployed version otherwise gets its own public hostname, carrying these same
# provider keys. The auth in `identify()` applies there too, so this is not a hole — but a
# proxy whose whole job is spending money on someone else's API should not have more public
# front doors than it needs.
preview_urls = false

# Secrets are never committed. Set them with:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put DEEPSEEK_API_KEY
#   wrangler secret put DEV_SHARED_SECRET     # simulator bypass only

[vars]
# Which provider answers each surface. Changing these is a deploy, not an App Review,
# which is most of why this server exists.
COACH_PROVIDER = "deepseek"
# Flash, not Pro. The coach does not reason over the data block — a rules engine already
# produced the state and the adjustments, and the prompt says so; the model explains a
# computed result in a voice, in under sixty words. That is input-heavy and output-light,
# with an identical system prompt every call, so cached input price is what is actually
# paid: Flash is 7.3x cheaper there, 3.3x on output, and carries 5x the concurrency.
COACH_MODEL = "deepseek-flash"
MEAL_PROVIDER = "deepseek"
MEAL_MODEL = "deepseek-flash"
# App Attest is on: every caller proves it is a real install of this app on real
# hardware, and the shared development secret is no longer a way in. Verified against
# Hao's phone before this was flipped, using a dry-run endpoint that disables itself
# the moment this is "true".
REQUIRE_ATTESTATION = "true"
APPLE_TEAM_ID = "V9JX42F864"
BUNDLE_ID = "com.coachjett.ios"
# Empty, which is the shipping value. "*" lifted the free-message cap for every caller
# and was the one line in this file that could not go out.
#
# Empty rather than a list of testers on purpose: TestFlight exists to test what ships,
# and a tester who never meets the cap never tests the cap, the paywall or the upgrade,
# which is the part most likely to be broken and the only part that earns anything. Add
# a specific attested key id here, comma separated, if somebody genuinely needs more
# while testing something else.
UNLIMITED_IDS = ""

[[durable_objects.bindings]]
name = "BUCKET"
class_name = "RateBucket"

# One per attested key. Strongly consistent because the counter is the replay defence:
# two requests racing an eventually consistent store would both read the same counter
# and both be accepted, which is the replay it exists to stop.
[[durable_objects.bindings]]
name = "ATTEST"
class_name = "AttestedInstall"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateBucket"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AttestedInstall"]

